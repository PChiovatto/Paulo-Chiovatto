<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Olá, estou online!</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    .card {
      width: 100%;
      max-width: 420px;
      text-align: center;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, .35);
    }
    h1 { margin: 0 0 12px; font-size: 1.9rem; line-height: 1.2; }
    p  { margin: 0; color: #94a3b8; font-size: .95rem; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(34, 197, 94, .12);
      color: #4ade80;
      font-size: .8rem;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #22c55e;
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1;  transform: scale(1); }
      50%      { opacity: .4; transform: scale(.8); }
    }
    .time { margin-top: 18px; font-size: .8rem; color: #64748b; }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  </style>
</head>
<body>
  <main class="card">
    <span class="status"><span class="dot"></span> Online</span>
    <h1>Olá, estou online! 👋</h1>
    <p>Esta página está no ar e funcionando normalmente.</p>
    <p class="time" id="agora"></p>
  </main>

  <script>
    // Relógio ao vivo com o horário local de quem está visitando.
    function atualizarHora() {
      document.getElementById('agora').textContent =
        new Date().toLocaleString('pt-BR');
    }
    atualizarHora();
    setInterval(atualizarHora, 1000);
  </script>
</body>
</html>
